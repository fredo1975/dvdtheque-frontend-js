server {
    listen 5173;

    # 1. Gestion du Frontend (React)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Gestion du Backend (Reverse Proxy)
    location /api/ {
        # 'dvdtheque-service' est le nom du service dans docker-compose.yml
        # Le port 8083 est le port interne du conteneur Java
        proxy_pass http://dvdtheque-service:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}